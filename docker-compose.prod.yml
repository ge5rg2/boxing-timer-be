version: "3.8"

services:
  db:
    image: postgres:15
    container_name: boxing-timer-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - boxing-timer-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: boxing-timer-redis
    volumes:
      - redis_data:/data
    networks:
      - boxing-timer-network
    restart: always

  api:
    build: .
    container_name: boxing-timer-api-prod
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DEBUG=false
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - boxing-timer-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: boxing-timer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    depends_on:
      - api
    networks:
      - boxing-timer-network
    restart: always

volumes:
  postgres_prod_data:
  redis_data:

networks:
  boxing-timer-network:
    driver: bridge
