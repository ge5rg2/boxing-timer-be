version: "3.8"

services:
  # 데이터베이스
  db:
    image: postgres:15
    container_name: boxing-timer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: boxing_timer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - boxing-timer-network

  # Redis (캐싱 및 세션 관리용 - 선택사항)
  redis:
    image: redis:7-alpine
    container_name: boxing-timer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - boxing-timer-network

  # API 서버
  api:
    build: .
    container_name: boxing-timer-api
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/boxing_timer
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    depends_on:
      - db
      - redis
    networks:
      - boxing-timer-network
    restart: unless-stopped

  # Nginx (프록시 서버 - 프로덕션용)
  nginx:
    image: nginx:alpine
    container_name: boxing-timer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - boxing-timer-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  boxing-timer-network:
    driver: bridge
